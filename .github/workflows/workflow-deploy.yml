name: CI + CD Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: microservices
        run: npm ci --no-audit --no-fund

      - name: Verify workspace build contracts
        working-directory: microservices
        run: npm run test:build-contract

      # Compiles @project-pc/common and every NestJS app (tsc) -> fails on type/syntax errors
      - name: Build all services
        working-directory: microservices
        run: npm run build

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # Catches FE type errors before images ship
      - name: Typecheck client
        working-directory: client
        run: npx tsc --noEmit

  docker:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            xuanho17102004/project-chat-social-frontend:latest
            xuanho17102004/project-chat-social-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}

      - name: Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-api-gateway:latest
            xuanho17102004/project-chat-social-api-gateway:${{ github.sha }}
          build-args: |
            SERVICE=api-gateway

      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-auth-service:latest
            xuanho17102004/project-chat-social-auth-service:${{ github.sha }}
          build-args: |
            SERVICE=auth-service

      - name: Build & Push Product Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-product-service:latest
            xuanho17102004/project-chat-social-product-service:${{ github.sha }}
          build-args: |
            SERVICE=product-service

      - name: Build & Push Cart Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-cart-service:latest
            xuanho17102004/project-chat-social-cart-service:${{ github.sha }}
          build-args: |
            SERVICE=cart-service

      - name: Build & Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-order-service:latest
            xuanho17102004/project-chat-social-order-service:${{ github.sha }}
          build-args: |
            SERVICE=order-service

      - name: Build & Push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-payment-service:latest
            xuanho17102004/project-chat-social-payment-service:${{ github.sha }}
          build-args: |
            SERVICE=payment-service

      - name: Build & Push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-notification-service:latest
            xuanho17102004/project-chat-social-notification-service:${{ github.sha }}
          build-args: |
            SERVICE=notification-service

      - name: Build & Push Chat Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-chat-service:latest
            xuanho17102004/project-chat-social-chat-service:${{ github.sha }}
          build-args: |
            SERVICE=chat-service

      - name: Build & Push History Log
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-history-log:latest
            xuanho17102004/project-chat-social-history-log:${{ github.sha }}
          build-args: |
            SERVICE=history-log

      - name: Build & Push Saga Orchestration Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-saga-orchestration-service:latest
            xuanho17102004/project-chat-social-saga-orchestration-service:${{ github.sha }}
          build-args: |
            SERVICE=saga-orchestration-service

      - name: Build & Push Elasticsearch Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices
          file: ./microservices/Dockerfile.service
          push: true
          tags: |
            xuanho17102004/project-chat-social-elasticsearch-service:latest
            xuanho17102004/project-chat-social-elasticsearch-service:${{ github.sha }}
          build-args: |
            SERVICE=elasticsearch-service

      - name: Build & Push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./microservices/apps/ai-service
          push: true
          tags: |
            xuanho17102004/project-chat-social-ai-service:latest
            xuanho17102004/project-chat-social-ai-service:${{ github.sha }}
  deploy:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write root .env
        env:
          ROOT_ENV: ${{ secrets.ROOT_ENV }}
        run: |
          if [ -z "$ROOT_ENV" ]; then
            echo "ROOT_ENV secret is missing" >&2
            exit 1
          fi
          printf '%s' "$ROOT_ENV" > .env

      - name: Pull images
        run: docker compose pull

      - name: Deploy stack
        run: docker compose up -d --remove-orphans
